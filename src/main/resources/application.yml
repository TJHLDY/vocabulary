server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vocabulary?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
  mail:
    host: smtp.163.com
    port: 465
    username: VocabNote@163.com
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.163.com
    default-encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
  remember-expiration: 31536000000

verify-code:
  expire-minutes: 5
  resend-seconds: 60

translate:
  baidu:
    app-id: 20260525002619839
    secret-key: KQQWOFGPf4QxRFoiLlRz

oss:
  endpoint: oss-cn-guangzhou.aliyuncs.com
  bucket: vocabnote
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
